<!-- Replicating the flow of src/pages/Index.tsx from React in Angular -->
<div class="min-h-screen bg-white">
  <div class="max-w-[915px] mx-auto bg-white rounded-lg p-6">
    <header class="flex items-center mb-8">
      <h1 class="text-[18px] font-medium text-black ml-4">Add Media</h1>
    </header>

    <main 
      [ngClass]="{
        'transition-all duration-300 opacity-100 translate-y-0': videoFile,
        'transition-all duration-300 opacity-0 translate-y-4': !videoFile
      }"
    >
      <ng-container *ngIf="!videoFile; else editorTemplate">
        <!-- Show Video Upload -->
        <app-video-upload (videoSelected)="onVideoSelected($event)"></app-video-upload>
      </ng-container>

      <ng-template #editorTemplate>
        <!-- Show Video Editor -->
        <app-video-editor 
          [videoFile]="videoFile!"
          (backClicked)="onBack()"
        ></app-video-editor>
      </ng-template>
    </main>
  </div>
</div>
