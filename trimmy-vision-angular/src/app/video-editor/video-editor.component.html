<!-- Replicating the UI from the original React VideoEditor component -->
<div class="space-y-8 animate-fade-in">
  <!-- Back button -->
  <button
    class="text-neutral-600 hover:text-neutral-900 border-none bg-transparent cursor-pointer flex items-center gap-2 mb-4"
    (click)="backButtonClick()"
  >
    <!-- ArrowLeft icon placeholder -->
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 18l-6-6 6-6"/>
    </svg>
    Back
  </button>

  <div class="grid grid-cols-2 gap-6">
    <!-- Video + rotation/crop/trim controls -->
    <div class="space-y-4">
      <div
        class="aspect-[9/16] bg-[#F5F5F5] rounded-lg overflow-hidden relative"
        (mousedown)="handleCropStart($event)"
        (mousemove)="handleCropMove($event)"
      >
        <video
          #videoElement
          [src]="videoUrl"
          [ngClass]="{
            'rotate-90': rotation === 90,
            'rotate-180': rotation === 180,
            'rotate-270': rotation === 270,
            'rotate-360': rotation === 0
          }"
          class="w-full h-full object-contain transition-transform duration-300"
          controls
        ></video>
        <!-- Crop overlay -->
        <div
          *ngIf="isCropping"
          class="absolute border-2 border-blue-500 bg-blue-500/20"
          [style.left.%]="cropDimensions.x"
          [style.top.%]="cropDimensions.y"
          [style.width.%]="cropDimensions.width"
          [style.height.%]="cropDimensions.height"
        ></div>
      </div>

      <!-- Rotate / Crop / Trim buttons -->
      <div class="grid grid-cols-3 gap-2">
        <!-- Rotate button -->
        <button
          class="border border-gray-300 rounded-md flex flex-col items-center gap-1 py-2 hover:bg-gray-50"
          (click)="handleRotate()"
        >
          <!-- RotateCw icon placeholder -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2v6h-6"/>
            <path d="M3.51 9a9 9 0 0 1 1.132-3.64 8.994 8.994 0 0 1 7.868-4.36 9.003 9.003 0 0 1 8.187 5"/>
            <path d="M21 12a9 9 0 0 1-9 9"/>
          </svg>
          <span class="text-xs">Rotate</span>
        </button>

        <!-- Crop button -->
        <button
          class="border border-gray-300 rounded-md flex flex-col items-center gap-1 py-2 hover:bg-gray-50"
          [class.bg-blue-50]="isCropping"
          (click)="handleCropToggle()"
        >
          <!-- Crop icon placeholder -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M6.13 1L6 16a2 2 0 0 0 2 2h15"/>
            <path d="M1 6.13 16 6a2 2 0 0 1 2 2v15"/>
          </svg>
          <span class="text-xs">Crop</span>
        </button>
        
        <!-- Trim button -->
        <button
          class="border border-gray-300 rounded-md flex flex-col items-center gap-1 py-2 hover:bg-gray-50"
        >
          <!-- Scissors icon placeholder -->
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="6" cy="6" r="3"/>
            <circle cx="6" cy="18" r="3"/>
            <path d="M20 4l-8 8l8 8"/>
            <line x1="8" y1="12" x2="12" y2="12"/>
          </svg>
          <span class="text-xs">Trim</span>
        </button>
      </div>
    </div>

    <!-- Description field, Next button, Trim slider -->
    <div class="space-y-4">
      <!-- Description field -->
      <div>
        <label class="text-xs font-medium text-black mb-1.5 block">Description</label>
        <textarea
          class="w-full min-h-[132px] rounded-md border border-[#E5E7EA] p-3 text-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#4633DC]"
          placeholder="Add a description..."
        ></textarea>
      </div>

      <!-- Next button -->
      <button
        class="w-full bg-[#4633DC] hover:bg-[#4633DC]/90 text-white font-semibold py-2.5 rounded-md"
        (click)="nextButtonClick()"
      >
        Next
      </button>

      <!-- Trim slider + thumbnails -->
      <div class="space-y-2">
        <div class="flex justify-between items-center">
          <p class="text-sm text-neutral-600">Trim Video</p>
          <p class="text-sm font-medium">{{ formatTime(currentTime) }}</p>
        </div>

        <div class="relative">
          <div class="flex overflow-hidden rounded-lg mb-2 h-20">
            <img
              *ngFor="let thumb of thumbnails"
              [src]="thumb"
              class="h-full object-cover"
              [style.width.%]="100 / thumbnails.length"
            />
          </div>

          <!-- A simple replacement for the twin-handle slider used in React. We'll do two range inputs here for demonstration. -->
          <div class="flex space-x-2">
            <input
              type="range"
              min="0"
              max="100"
              [value]="trimStart"
              (input)="handleInputChange($event, true)"
            />
            <input
              type="range"
              min="0"
              max="100"
              [value]="trimEnd"
              (input)="handleInputChange($event, false)"
            />
          </div>
        </div>

        <div class="flex justify-between text-xs text-neutral-600">
          <span>{{ formatTime((trimStart / 100) * duration) }}</span>
          <span>{{ formatTime((trimEnd / 100) * duration) }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
